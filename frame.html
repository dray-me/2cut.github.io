<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame - Image Splitter</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      background: #f1f5f9;
      cursor: pointer;
      display: inline-block;
      margin: 20px 0;
    }
    input[type="file"] { display: none; }
    .upload-btn {
      background: #2563eb;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .preview-grid {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      flex: 1;
      min-width: 250px;
      max-width: 360px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .dl-btn {
      margin-top: 12px;
      background: #10b981;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Frame</h1>
    <p>Cut 1 photo into 2 seamless halves for Instagram carousels & reposts</p>

    <!-- File Input -->
    <label class="upload-box" for="fileInput">
      <span class="upload-btn">Select an Image</span>
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <!-- Results Area -->
    <div id="previewSection" style="display: none;">
      <div class="preview-grid">
        <div class="card">
          <h3>Part 1 (Left Half)</h3>
          <canvas id="canvasLeft"></canvas>
          <a id="downloadLeft" class="dl-btn" download="frame_part1.png">Download Part 1</a>
        </div>
        <div class="card">
          <h3>Part 2 (Right Half)</h3>
          <canvas id="canvasRight"></canvas>
          <a id="downloadRight" class="dl-btn" download="frame_part2.png">Download Part 2</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const canvasLeft = document.getElementById('canvasLeft');
    const canvasRight = document.getElementById('canvasRight');
    const downloadLeft = document.getElementById('downloadLeft');
    const downloadRight = document.getElementById('downloadRight');

    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          splitImage(img);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function splitImage(img) {
      const totalWidth = img.naturalWidth;
      const totalHeight = img.naturalHeight;
      const halfWidth = Math.floor(totalWidth / 2);

      // 1. Prepare canvas dimensions
      canvasLeft.width = halfWidth;
      canvasLeft.height = totalHeight;

      canvasRight.width = totalWidth - halfWidth;
      canvasRight.height = totalHeight;

      const ctxLeft = canvasLeft.getContext('2d');
      const ctxRight = canvasRight.getContext('2d');

      // 2. Crop and draw the left slice: (0 to halfWidth)
      ctxLeft.drawImage(
        img,
        0, 0, halfWidth, totalHeight,
        0, 0, halfWidth, totalHeight
      );

      // 3. Crop and draw the right slice: (halfWidth to end)
      ctxRight.drawImage(
        img,
        halfWidth, 0, canvasRight.width, totalHeight,
        0, 0, canvasRight.width, totalHeight
      );

      // 4. Update download links
      downloadLeft.href = canvasLeft.toDataURL('image/png');
      downloadRight.href = canvasRight.toDataURL('image/png');

      previewSection.style.display = 'block';
    }
  </script>
</body>
</html>
